<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>墨阅 Reader · UI 效果图</title>
<style>
  :root{
    --primary:#4B7BEC; --primaryDeep:#3A5FCC; --accent:#7B6CF6;
    --gStart:#5B8DEF; --gEnd:#8A6CF7;
    --bg:#F5F7FB; --surface:#fff;
    --t1:#1E2433; --t2:#6B7488; --t3:#A7AEBC;
    --divider:#EDF0F6;
    --paper:#F7F1E3; --paperInk:#2C2A26;
    --font:"MiSans","Alibaba PuHuiTi 2.0","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{font-family:var(--font);background:#EEF2F9;color:var(--t1)}

  .board{padding:56px 48px 64px}
  .board-head{text-align:center;margin-bottom:44px}
  .board-head h1{font-size:40px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(135deg,var(--gStart),var(--gEnd));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .board-head p{margin-top:10px;font-size:15px;color:#7C8698;letter-spacing:1px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px;justify-items:center}
  figure{display:flex;flex-direction:column;align-items:center;gap:16px}
  figcaption{font-size:15px;font-weight:600;color:#5A6478;letter-spacing:1px}
  figcaption span{display:block;font-size:12px;font-weight:400;color:#98A1B3;margin-top:3px}

  /* ---------- 手机外壳 ---------- */
  .phone{width:356px;height:756px;background:#0E1116;border-radius:46px;padding:11px;
    box-shadow:0 30px 70px rgba(31,45,73,.28),0 2px 0 rgba(255,255,255,.5) inset;position:relative}
  .phone::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
    top:22px;width:108px;height:26px;background:#0E1116;border-radius:14px;z-index:20}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;
    background:var(--bg);display:flex;flex-direction:column}

  .statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 22px 6px;font-size:12px;font-weight:600;z-index:10}
  .statusbar .rt{display:flex;align-items:center;gap:5px}
  .sig{display:flex;align-items:flex-end;gap:2px}
  .sig i{display:block;width:3px;background:currentColor;border-radius:1px}
  .sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}
  .sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}
  .bat{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative}
  .bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;
    background:currentColor;border-radius:0 1px 1px 0}
  .bat i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:14px;background:currentColor;border-radius:1.5px}

  .body{flex:1;overflow:hidden;position:relative}
  /* 内容超出一屏时，底部渐隐示意可继续滚动 */
  .body.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58px;
    background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:5}

  /* ---------- 通用组件 ---------- */
  .search{height:46px;background:#F1F4FA;border-radius:18px;display:flex;align-items:center;
    padding:0 16px;gap:9px;font-size:14px;color:var(--t3)}
  .search svg{flex:0 0 auto}

  .cover{border-radius:12px;position:relative;overflow:hidden;
    box-shadow:0 10px 22px rgba(43,58,85,.18)}
  .cover .spine{position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(255,255,255,.28)}
  .cover .orb{position:absolute;right:-18px;top:-18px;width:64px;height:64px;
    border-radius:50%;background:rgba(255,255,255,.12)}
  .cover .txt{position:absolute;inset:0;padding:14px 12px;display:flex;flex-direction:column}
  .cover .ttl{color:#fff;font-size:15px;font-weight:700;line-height:1.25}
  .cover .au{color:rgba(255,255,255,.85);font-size:11px;margin-top:auto}

  .sec-title{display:flex;align-items:center;justify-content:space-between;
    font-size:17px;font-weight:700}
  .sec-title em{font-style:normal;font-size:13px;font-weight:400;color:var(--t2)}

  .card{background:var(--surface);border-radius:20px;box-shadow:0 4px 14px rgba(43,58,85,.07)}

  .nav{height:62px;flex:0 0 62px;background:#fff;display:flex;align-items:center;
    justify-content:space-around;border-top:1px solid var(--divider);font-size:11px}
  .nav div{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--t3)}
  .nav div.on{color:var(--primary)}
  .nav svg{width:23px;height:23px}

  /* ---------- 发现页 ---------- */
  .p-disc{padding:0 18px}
  .p-disc h2{font-size:28px;font-weight:700;padding:10px 0 10px}
  .daily{height:140px;border-radius:24px;padding:20px;margin-top:12px;display:flex;gap:16px;
    background:linear-gradient(135deg,var(--gStart),var(--gEnd));
    box-shadow:0 8px 18px rgba(91,141,239,.28)}
  .daily .l{flex:1;display:flex;flex-direction:column}
  .pill{align-self:flex-start;padding:4px 10px;border-radius:20px;font-size:12px;color:#fff;
    background:rgba(255,255,255,.22)}
  .daily .bt{font-size:24px;font-weight:700;color:#fff;margin-top:12px}
  .daily .ba{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px}
  .daily .bq{font-size:13px;color:#fff;line-height:1.5;margin-top:auto}
  .chips{display:flex;gap:10px;padding:12px 0 4px;overflow:hidden}
  .chip{padding:8px 14px;border-radius:12px;font-size:14px;background:#F1F4FA;color:var(--t1);white-space:nowrap}
  .chip.on{background:var(--primary);color:#fff}
  .hscroll{display:flex;gap:14px}
  .newbk{width:112px;flex:0 0 112px}
  .rank{display:flex;align-items:center;gap:12px;padding:8px 0}
  .rank .m{flex:1;min-width:0}
  .rank .m b{font-size:14px;font-weight:600;display:block}
  .rank .m s{text-decoration:none;font-size:12px;color:var(--t2);display:block;margin-top:3px}

  /* ---------- 书架页 ---------- */
  .p-shelf{padding:0 18px}
  .p-shelf h2{font-size:28px;font-weight:700;padding:14px 0 12px;display:flex;
    align-items:center;justify-content:space-between}
  .folders{display:flex;gap:10px;padding:12px 0}
  .folder{width:106px;flex:0 0 106px;height:80px;background:#fff;border-radius:18px;padding:12px;
    display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(43,58,85,.07)}
  .folder b{font-size:13px;font-weight:600;margin-top:auto}
  .folder s{text-decoration:none;font-size:11px;color:var(--t3);margin-top:2px}
  .books{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
  .bkitem .t{font-size:12px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:3px;border-radius:3px;background:var(--divider);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--primary)}
  .bkitem s{text-decoration:none;font-size:10px;color:var(--t3);display:block;margin-top:3px}

  /* ---------- 阅读页 ---------- */
  .p-read{background:var(--paper);flex:1;position:relative;display:flex;flex-direction:column}
  .p-read .vbody{flex:1;padding:34px 26px 20px;display:flex;justify-content:flex-end;
    writing-mode:vertical-rl;text-orientation:upright}
  .p-read .vbody p{font-size:15px;line-height:2.05;color:var(--paperInk);letter-spacing:1.5px;
    max-height:100%;font-weight:400}
  .p-read .vbody p b{font-weight:700;font-size:16px}
  .rfoot{flex:0 0 auto;padding:0 22px 20px;display:flex;align-items:center;gap:12px;
    font-size:11px;color:rgba(44,42,38,.55)}
  .rfoot .bar{flex:1;background:rgba(44,42,38,.13)}
  .rfoot .bar i{background:var(--primary)}
  .rtop{position:absolute;top:0;left:0;right:0;padding:12px 20px 10px;display:flex;
    align-items:center;justify-content:space-between;background:linear-gradient(var(--paper),rgba(247,241,227,0));
    font-size:13px;color:rgba(44,42,38,.6)}

  /* ---------- 听书面板 ---------- */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;
    border-radius:22px 22px 0 0;padding:12px 20px 20px;box-shadow:0 -8px 30px rgba(31,45,73,.16);z-index:30}
  .handle{width:40px;height:4px;border-radius:2px;background:var(--divider);margin:0 auto 12px}
  .sheet h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .seg{display:flex;background:#F1F4FA;border-radius:12px;padding:3px;gap:3px}
  .seg div{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:13px;color:var(--t2)}
  .seg div.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 2px 6px rgba(43,58,85,.12)}
  .field{margin-top:12px;height:46px;background:#F1F4FA;border-radius:14px;display:flex;
    align-items:center;padding:0 14px;gap:9px;font-size:14px}
  .field em{font-style:normal;margin-left:auto;color:var(--t3);font-size:12px}
  .row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px}
  .track{flex:1;height:4px;border-radius:4px;background:var(--divider);position:relative}
  .track i{position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--primary);border-radius:4px}
  .track b{position:absolute;left:62%;top:-4px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:3px solid var(--primary);box-sizing:border-box}
  .ctl{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px}
  .ctl .mini{width:44px;height:44px;border-radius:50%;background:#F1F4FA;display:flex;
    align-items:center;justify-content:center}
  .ctl .big{width:60px;height:60px;border-radius:50%;background:var(--primary);display:flex;
    align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(75,123,236,.36)}
  .sfoot{text-align:center;font-size:12px;color:var(--t3);margin-top:12px}

  /* ---------- AI 中心 ---------- */
  .p-ai{padding:0 18px;display:flex;flex-direction:column;height:100%}
  .aihead{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px}
  .aihead h2{font-size:28px;font-weight:700}
  .aigrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .aicard{background:#fff;border-radius:18px;padding:15px;display:flex;align-items:center;gap:10px;
    box-shadow:0 4px 12px rgba(43,58,85,.07)}
  .aicard .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
  .aicard b{font-size:13px;font-weight:600}
  .out{flex:1;background:#fff;border-radius:20px;margin-top:16px;padding:16px;
    box-shadow:0 4px 12px rgba(43,58,85,.07);font-size:12.5px;line-height:1.85;color:var(--t1);overflow:hidden}
  .out h4{font-size:13px;font-weight:700;margin-bottom:10px}
  .out .ln{color:var(--t2);margin-bottom:7px}
  .out .ln::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--primary);margin-right:8px;vertical-align:middle}
  .bubble{align-self:flex-start;background:#F1F4FA;border-radius:14px;padding:9px 12px;
    font-size:12px;line-height:1.6;margin-top:12px;max-width:88%}
  .bubble.me{align-self:flex-end;background:rgba(75,123,236,.12)}
  .askrow{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--divider)}
  .askrow .in{flex:1;height:40px;background:#F1F4FA;border-radius:14px;display:flex;
    align-items:center;padding:0 14px;font-size:13px;color:var(--t3)}
  .askrow .send{width:38px;height:38px;border-radius:50%;background:var(--primary);display:flex;
    align-items:center;justify-content:center;flex:0 0 38px}

  .fab{position:absolute;right:18px;bottom:78px;height:44px;border-radius:22px;padding:0 18px;
    background:var(--primary);color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;
    box-shadow:0 8px 20px rgba(75,123,236,.4);z-index:25}
  .homebar{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:126px;height:5px;
    border-radius:3px;background:rgba(30,36,51,.22);z-index:40}
</style>
</head>

        <div class="nav">

      <figcaption>发现页<span>搜索 · 每日推荐 · 新书速递</span></figcaption>
    </figure>

    <!-- 2 书架页 -->

                <div class="txt"><div class="ttl">桃花源记</div><div class="au">陶渊明</div></div></div>
